global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 5s
    # In Docker for Mac, host.docker.internal resolves to the host IP.
    # We will run our Node backend on the host at port 5000.
    static_configs:
      - targets: ['host.docker.internal:5000']
